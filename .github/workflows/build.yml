name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Your signing key, stored as repository secrets (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64   the release.keystore file, base64-encoded
      #   KEYSTORE_PASSWORD its password        (optional KEY_ALIAS, KEY_PASSWORD)
      # Without them the APK is signed with a debug key (fine for testing, but it can't update an APK signed with your key).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the APK
        id: name
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "GroveLauncher-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: GroveLauncher-${{ steps.name.outputs.version }}
          path: GroveLauncher-*.apk

      # Every push to main also publishes a release for its version, with the APK attached.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.name.outputs.version }}
          gh release view "v$V" >/dev/null 2>&1 \
            && gh release upload "v$V" "GroveLauncher-$V.apk" --clobber \
            || gh release create "v$V" "GroveLauncher-$V.apk" --title "Grove Launcher $V" --notes "Automatic build of $V."
